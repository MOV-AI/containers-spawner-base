version: 3.2.1

images:
  - name: spawner-base-noetic
    docker_file: docker/noetic/Dockerfile
    docker_image: qa/spawner-base-noetic
    public_image: ce/spawner-base-noetic
    platforms: linux/amd64
    public: true
    snyk_check: true
    target: spawner

  - name: spawner-ign-noetic
    docker_file: docker/noetic/Dockerfile
    docker_image: qa/spawner-ign-noetic
    public_image: ce/spawner-ign-noetic
    platforms: linux/amd64
    public: true
    snyk_check: true
    target: spawner-ign

  - name: spawner-base-humble
    docker_file: docker/humble/Dockerfile
    docker_image: qa/spawner-base-humble
    public_image: ce/spawner-base-humble
    platforms: linux/amd64
    public: true
    snyk_check: true
    target: spawner

  - name: ros-humble-ros1-bridge-builder
    docker_file: docker/humble/Dockerfile
    docker_image: qa/ros-humble-ros1-bridge-builder
    public_image: ce/ros-humble-ros1-bridge-builder
    platforms: linux/amd64
    public: true
    snyk_check: true
    target: ros1-bridge-builder
